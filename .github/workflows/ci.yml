name: CI

on:
    push:
        branches:
            - master
            - staging
            - "release/**"
    pull_request:
        branches:
            - master
            - staging
            - "release/**"

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Test
              run: npm test

            - name: Build plugin
              run: npm run build:plugin
