name: Release

on:
    push:
        tags:
            - "*"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - name: Verify release version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  package_version="$(node -p "require('./package.json').version")"
                  manifest_version="$(node -p "require('./manifest.json').version")"
                  manifest_min_app="$(node -p "require('./manifest.json').minAppVersion")"
                  versions_min_app="$(node -p "require('./versions.json')[process.argv[1]] || ''" "$manifest_version")"
                  if [ "$tag" != "$package_version" ] || \
                     [ "$tag" != "$manifest_version" ] || \
                     [ "$manifest_min_app" != "$versions_min_app" ]; then
                    echo "Tag, package.json, manifest.json, and versions.json must agree" >&2
                    exit 1
                  fi

            - name: Build plugin
              run: |
                  npm ci
                  npm run build:ci

            - name: Upload workflow artifact
              uses: actions/upload-artifact@v4
              with:
                  name: obsidian-zotflow-${{ github.ref_name }}
                  path: |
                      main.js
                      manifest.json
                      styles.css
                  if-no-files-found: error
                  compression-level: 0

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Create draft release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  gh release create "$RELEASE_TAG" \
                    --verify-tag \
                    --title "$RELEASE_TAG" \
                    --draft \
                    main.js \
                    manifest.json \
                    styles.css
