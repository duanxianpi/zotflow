name: Release

on:
    push:
        tags:
            - "*"

jobs:
    build:
        if: ${{ !contains(github.ref_name, '-') }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  submodules: recursive

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - name: Verify release version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Stable release tags must use x.y.z" >&2
                    exit 1
                  fi
                  node scripts/release-version.mjs verify \
                    --version "$tag" \
                    --channel stable

                  git fetch origin dev:refs/remotes/origin/dev
                  if ! git merge-base --is-ancestor HEAD refs/remotes/origin/dev; then
                    echo "Stable tag must point to a commit contained in origin/dev" >&2
                    exit 1
                  fi

            - name: Build plugin
              run: |
                  npm ci
                  npm run build:ci

            - name: Generate release notes
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  previous_tag="$(
                    git tag --merged HEAD --sort=-v:refname |
                      while IFS= read -r tag; do
                        if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "$tag" != "$RELEASE_TAG" ]; then
                          printf '%s\n' "$tag"
                          break
                        fi
                      done
                  )"
                  notes_file="$RUNNER_TEMP/release-notes.md"
                  {
                    printf 'Stable candidate built from commit `%s`.\n\n' "$GITHUB_SHA"
                    printf 'Built with `npm ci` and `npm run build:ci`.\n'
                    if [ -n "$previous_tag" ]; then
                      printf '\n## Commits since %s\n\n' "$previous_tag"
                      git log --reverse \
                        --format="- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H)) — %an" \
                        "$previous_tag..HEAD"
                      printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                        "$GITHUB_REPOSITORY" "$previous_tag" "$RELEASE_TAG"
                    fi
                  } > "$notes_file"

            - name: Upload workflow artifact
              uses: actions/upload-artifact@v4
              with:
                  name: obsidian-zotflow-${{ github.ref_name }}
                  path: |
                      main.js
                      manifest.json
                      styles.css
                  if-no-files-found: error
                  compression-level: 0

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Create draft release
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                    echo "Release $RELEASE_TAG already exists; keeping it for an idempotent rerun"
                    exit 0
                  fi
                  gh release create "$RELEASE_TAG" \
                    --verify-tag \
                    --title "$RELEASE_TAG" \
                    --notes-file "$RUNNER_TEMP/release-notes.md" \
                    --draft \
                    main.js \
                    manifest.json \
                    styles.css
